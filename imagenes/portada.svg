<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Paisaje andino con montañas, un río con un flotador, un sendero con un caminante, un bus eléctrico en la vía y gráficas de posición y velocidad">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <marker id="pah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <marker id="pah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="url(#sky)"/>
  <circle cx="1040" cy="90" r="46" fill="#fde68a"/>
  <!-- cordillera -->
  <path d="M0,250 L120,150 L210,215 L330,110 L450,220 L560,140 L690,230 L800,120 L930,210 L1050,150 L1200,230 L1200,330 L0,330 Z" fill="#86b49a"/>
  <path d="M0,290 L140,210 L260,270 L400,190 L520,270 L650,200 L780,280 L920,200 L1060,260 L1200,220 L1200,340 L0,340 Z" fill="#4d8f6a"/>
  <!-- cafetales -->
  <g fill="#2f6f4f">
    <circle cx="90" cy="300" r="9"/><circle cx="118" cy="296" r="9"/><circle cx="146" cy="300" r="9"/><circle cx="174" cy="296" r="9"/>
    <circle cx="980" cy="290" r="9"/><circle cx="1008" cy="286" r="9"/><circle cx="1036" cy="290" r="9"/><circle cx="1064" cy="286" r="9"/>
  </g>
  <!-- sendero -->
  <rect x="0" y="330" width="1200" height="30" fill="#a3b18a"/>
  <path d="M30,347 L1170,347" stroke="#7c6a46" stroke-width="10" stroke-linecap="round"/>
  <g stroke="#0f172a" stroke-width="5" stroke-linecap="round">
    <line x1="300" y1="312" x2="300" y2="332"/><line x1="300" y1="332" x2="291" y2="345"/><line x1="300" y1="332" x2="309" y2="345"/><line x1="290" y1="320" x2="310" y2="320"/>
  </g>
  <circle cx="300" cy="303" r="8" fill="#f59e0b"/>
  <!-- río con flotador -->
  <rect x="0" y="360" width="1200" height="62" fill="url(#river)"/>
  <g stroke="#bae6fd" stroke-width="3" fill="none" opacity="0.7">
    <path d="M60,382 q14,-8 28,0"/><path d="M260,400 q14,-8 28,0"/><path d="M480,384 q14,-8 28,0"/><path d="M700,402 q14,-8 28,0"/><path d="M920,384 q14,-8 28,0"/><path d="M1120,402 q14,-8 28,0"/>
  </g>
  <g fill="#f97316"><circle cx="420" cy="392" r="10" opacity="0.3"/><circle cx="500" cy="392" r="10" opacity="0.45"/><circle cx="580" cy="392" r="10" opacity="0.65"/><circle cx="660" cy="392" r="12"/></g>
  <line x1="676" y1="392" x2="740" y2="392" stroke="#f97316" stroke-width="4" marker-end="url(#pah2)"/>
  <!-- vía y bus eléctrico -->
  <rect x="0" y="422" width="1200" height="78" fill="#475569"/>
  <path d="M0,462 L1200,462" stroke="#facc15" stroke-width="4" stroke-dasharray="34 22"/>
  <g opacity="0.25"><rect x="760" y="430" width="120" height="28" rx="6" fill="#059669"/></g>
  <g opacity="0.45"><rect x="860" y="430" width="120" height="28" rx="6" fill="#059669"/></g>
  <rect x="990" y="424" width="150" height="34" rx="8" fill="#059669" stroke="#a7f3d0" stroke-width="3"/>
  <g fill="#d1fae5"><rect x="1002" y="431" width="20" height="13" rx="2"/><rect x="1030" y="431" width="20" height="13" rx="2"/><rect x="1058" y="431" width="20" height="13" rx="2"/><rect x="1086" y="431" width="20" height="13" rx="2"/><rect x="1114" y="431" width="18" height="13" rx="2"/></g>
  <circle cx="1020" cy="461" r="10" fill="#0f172a"/><circle cx="1110" cy="461" r="10" fill="#0f172a"/>
  <path d="M1066,449 c6,-10 18,-10 22,-4 c-6,10 -18,10 -22,4z" fill="#bbf7d0"/>
  <!-- tarjetas de gráficas -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="40" y="30" width="250" height="170" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="70" y1="175" x2="270" y2="175" stroke="#0f172a" stroke-width="2" marker-end="url(#pah)"/>
    <line x1="70" y1="175" x2="70" y2="48" stroke="#0f172a" stroke-width="2" marker-end="url(#pah)"/>
    <path d="M70,160 L250,70" stroke="#1565c0" stroke-width="4" fill="none"/>
    <path d="M70,170 Q160,168 250,62" stroke="#c62828" stroke-width="4" fill="none"/>
    <text x="262" y="193" font-size="15" font-style="italic" font-weight="700" fill="#0f172a">t</text>
    <text x="78" y="56" font-size="15" font-style="italic" font-weight="700" fill="#0f172a">x</text>
    <text x="150" y="95" font-size="13" font-weight="700" fill="#1565c0">MRU</text>
    <text x="196" y="150" font-size="13" font-weight="700" fill="#c62828">MUA</text>
    <rect x="320" y="30" width="250" height="170" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="350" y1="175" x2="550" y2="175" stroke="#0f172a" stroke-width="2" marker-end="url(#pah)"/>
    <line x1="350" y1="175" x2="350" y2="48" stroke="#0f172a" stroke-width="2" marker-end="url(#pah)"/>
    <path d="M350,165 L530,75 L530,175 L350,175 Z" fill="#2e7d32" opacity="0.22"/>
    <path d="M350,165 L530,75" stroke="#6a1b9a" stroke-width="4"/>
    <text x="542" y="193" font-size="15" font-style="italic" font-weight="700" fill="#0f172a">t</text>
    <text x="358" y="56" font-size="15" font-style="italic" font-weight="700" fill="#0f172a">v</text>
    <text x="440" y="160" font-size="13" font-weight="700" fill="#2e7d32">área = Δx</text>
    <text x="400" y="100" font-size="13" font-weight="700" fill="#6a1b9a">pendiente = a</text>
  </g>
</svg>
